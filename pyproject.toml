[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saos-jumpper"
version = "0.1.0"
description = "Cross-chain batched proof notary - anchor any claim to Ethereum mainnet for a fraction of a cent, witnessed by five independent chain clocks."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["requests>=2.28"]

[project.scripts]
jumpper-verify = "jumpper.verify:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jumpper = ["py.typed"]
